<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XAUUSD Institutional Zones</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        header {
            background: #161b22;
            padding: 10px 14px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            flex-shrink: 0;
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: #f0883e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            background: #238636;
            color: #ffffff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .chart-wrapper {
            flex: 1;
            width: 100%;
            height: calc(100vh - 48px);
            position: relative;
            background: #0d1117;
        }

        /* TradingView widget forced container */
        .tradingview-widget-container {
            width: 100% !important;
            height: 100% !important;
        }

        .tradingview-widget-container > div {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <header>
            <div class="title">XAUUSD INSTITUTIONAL ZONES</div>
            <span class="badge">SMC & LIQUIDITY</span>
        </header>
        
        <div class="chart-wrapper">
            <div class="tradingview-widget-container">
                <div id="tradingview_xau"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "OANDA:XAUUSD",
                    "interval": "15",
                    "timezone": "Asia/Bangkok",
                    "theme": "dark",
                    "style": "1",
                    "locale": "th",
                    "toolbar_bg": "#161b22",
                    "enable_publishing": false,
                    "hide_side_toolbar": false,
                    "allow_symbol_change": false,
                    "container_id": "tradingview_xau",
                    "studies": [
                        "STD;Pivots%1High%1Low",
                        "STD;Volume_Profile_Visible_Range"
                    ],
                    "disabled_features": [
                        "header_symbol_search",
                        "header_compare"
                    ],
                    "enabled_features": ["study_templates"]
                });
                </script>
            </div>
        </div>
    </div>

</body>
</html>
