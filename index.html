<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XAUUSD Institutional Zones</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
        }

        header {
            background: #1e222d;
            padding: 0 16px;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            flex-shrink: 0;
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: #f0883e;
            letter-spacing: 0.5px;
        }

        .badge {
            background: #2962ff;
            color: #ffffff;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .chart-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 48px);
            position: relative;
        }

        .tradingview-widget-container {
            width: 100% !important;
            height: 100% !important;
        }

        #tradingview_xau {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <header>
            <div class="title">XAUUSD INSTITUTIONAL ZONES</div>
            <span class="badge">SMC ZONES</span>
        </header>
        
        <div class="chart-container">
            <div class="tradingview-widget-container">
                <div id="tradingview_xau"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "OANDA:XAUUSD",
                    "interval": "15",
                    "timezone": "Asia/Bangkok",
                    "theme": "dark",
                    "style": "1",
                    "locale": "th",
                    "toolbar_bg": "#1e222d",
                    "enable_publishing": false,
                    "hide_side_toolbar": false,
                    "allow_symbol_change": false,
                    "container_id": "tradingview_xau",
                    "studies": [
                        "STD;Pivot%1Points%1High%1Low",
                        "STD;Volume_Profile_Visible_Range"
                    ]
                });
                </script>
            </div>
        </div>
    </div>

</body>
</html>
