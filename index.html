<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Institutional Entry Zones</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        header { background: #161b22; padding: 10px 15px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 16px; color: #f0883e; font-weight: 600; }
        .badge { background: #238636; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        #chart-container { flex: 1; width: 100%; position: relative; }
        .tradingview-widget-container { height: 100% !important; width: 100% !important; }
    </style>
</head>
<body>

    <header>
        <h1>XAUUSD ENTRY ZONES</h1>
        <span class="badge">SMC & Liquidity</span>
    </header>

    <div id="chart-container">
        <div class="tradingview-widget-container">
            <div id="tradingview_xau"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
            new TradingView.widget({
                "autosize": true,
                "symbol": "OANDA:XAUUSD",
                "interval": "15",
                "timezone": "Asia/Bangkok",
                "theme": "dark",
                "style": "1",
                "locale": "th",
                "toolbar_bg": "#161b22",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": false,
                "container_id": "tradingview_xau",
                "studies": [
                    "STD;Pivot%1Points%1High%1Low",
                    "STD;Volume_Profile_Visible_Range"
                ],
                "disabled_features": ["header_symbol_search"],
                "enabled_features": ["study_templates"]
            });
            </script>
        </div>
    </div>

</body>
</html>
