<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XAUUSD Institutional Orderflow & Zones</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
        }

        header {
            background: #161b22;
            padding: 0 16px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            flex-shrink: 0;
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: #f0883e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-container {
            display: flex;
            gap: 6px;
        }

        .badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-sell { background: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid #f85149; }
        .badge-buy { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #3fb950; }

        .content-area {
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 48px);
            position: relative;
        }

        /* Chart Area */
        .chart-wrapper {
            flex: 1;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Right Side Order Depth / Zone Bar */
        .order-depth-panel {
            width: 130px;
            background: #161b22;
            border-left: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 6px;
            font-size: 11px;
            user-select: none;
        }

        .zone-box {
            border-radius: 6px;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sell-zone {
            background: rgba(248, 81, 73, 0.12);
            border: 1px solid rgba(248, 81, 73, 0.4);
        }

        .buy-zone {
            background: rgba(46, 160, 67, 0.12);
            border: 1px solid rgba(46, 160, 67, 0.4);
        }

        .zone-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sell-title { color: #f85149; }
        .buy-title { color: #3fb950; }

        .price-level {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 10.5px;
        }

        .bar-container {
            width: 100%;
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 2px;
        }

        .fill-sell { background: #f85149; height: 100%; }
        .fill-buy { background: #3fb950; height: 100%; }

        .current-price-indicator {
            background: #21262d;
            border: 1px solid #58a6ff;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }

        .current-price-label {
            font-size: 9px;
            color: #8b949e;
        }

        .current-price-val {
            font-size: 12px;
            font-weight: bold;
            color: #58a6ff;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <header>
            <div class="title">XAUUSD LIQUIDITY ZONES</div>
            <div class="badge-container">
                <span class="badge badge-sell">SELL ZONE</span>
                <span class="badge badge-buy">BUY ZONE</span>
            </div>
        </header>
        
        <div class="content-area">
            <!-- Chart Area -->
            <div class="chart-wrapper">
                <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_widget&symbol=OANDA%3AXAUUSD&interval=15&hidesidetoolbar=0&symboledit=1&saveimage=1&toolbarbg=161b22&theme=dark&style=1&timezone=Asia%2FBangkok"></iframe>
            </div>

            <!-- Side Order Depth & Zones Panel -->
            <div class="order-depth-panel">
                <!-- SELL ZONE -->
                <div class="zone-box sell-zone">
                    <div class="zone-title sell-title">🔴 Sell Zone</div>
                    <div class="price-level">
                        <span>4180.0</span>
                        <span style="color:#f85149;">85%</span>
                    </div>
                    <div class="bar-container"><div class="fill-sell" style="width: 85%;"></div></div>

                    <div class="price-level" style="margin-top: 4px;">
                        <span>4165.0</span>
                        <span style="color:#f85149;">62%</span>
                    </div>
                    <div class="bar-container"><div class="fill-sell" style="width: 62%;"></div></div>
                </div>

                <!-- CURRENT PRICE -->
                <div class="current-price-indicator">
                    <div class="current-price-label">SPOT PRICE</div>
                    <div class="current-price-val">4140.21</div>
                </div>

                <!-- BUY ZONE -->
                <div class="zone-box buy-zone">
                    <div class="price-level">
                        <span>4100.0</span>
                        <span style="color:#3fb950;">70%</span>
                    </div>
                    <div class="bar-container"><div class="fill-buy" style="width: 70%;"></div></div>

                    <div class="price-level" style="margin-top: 4px;">
                        <span>4080.0</span>
                        <span style="color:#3fb950;">90%</span>
                    </div>
                    <div class="bar-container"><div class="fill-buy" style="width: 90%;"></div></div>
                    <div class="zone-title buy-title" style="margin-top: 4px;">🟢 Buy Zone</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
