<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XAUUSD Institutional Zones</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background-color: #0b0e14; color: #e1e4e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        header { background: #161b22; padding: 12px 16px; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; align-items: center; height: 50px; flex-shrink: 0; }
        .title { font-size: 15px; font-weight: 700; color: #f0883e; letter-spacing: 0.5px; }
        .status { font-size: 11px; background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #238636; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
        #chart { flex: 1; width: 100%; height: calc(100vh - 50px); position: relative; }
        .legend { position: absolute; top: 10px; left: 10px; z-index: 10; font-size: 12px; background: rgba(22, 27, 34, 0.85); padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; backdrop-filter: blur(4px); pointer-events: none; }
        .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .legend-item:last-child { margin-bottom: 0; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-supply { background: #f85149; }
        .dot-demand { background: #2ea043; }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <div class="title">XAUUSD ORDER FLOW</div>
            <div class="status">LIVE ZONES</div>
        </header>
        
        <div id="chart">
            <div class="legend">
                <div class="legend-item"><span class="dot dot-supply"></span> Supply / Institutional Sell Zone</div>
                <div class="legend-item"><span class="dot dot-demand"></span> Demand / Institutional Buy Zone</div>
            </div>
        </div>
    </div>

    <script>
        const chartElement = document.getElementById('chart');
        
        // สร้าง Chart Container ให้เต็มพื้นที่
        const chart = LightweightCharts.createChart(chartElement, {
            layout: {
                backgroundColor: '#0b0e14',
                textColor: '#8b949e',
            },
            grid: {
                vertLines: { color: '#161b22' },
                horzLines: { color: '#161b22' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            rightPriceScale: {
                borderColor: '#30363d',
            },
            timeScale: {
                borderColor: '#30363d',
                timeVisible: true,
                secondsVisible: false,
            },
        });

        // แท่งเทียน
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#2ea043',
            downColor: '#f85149',
            borderVisible: false,
            wickUpColor: '#2ea043',
            wickDownColor: '#f85149',
        });

        // สร้างข้อมูลจำลองโครงสร้างราคาทองคำสำหรับแสดงผล Clean UI
        const now = Math.floor(Date.now() / 1000);
        const day = 86400;
        let basePrice = 2650.00;
        const data = [];

        for (let i = 60; i >= 0; i--) {
            const time = now - (i * 3600);
            const open = basePrice + (Math.random() - 0.48) * 8;
            const high = open + Math.random() * 6;
            const low = open - Math.random() * 6;
            const close = (high + low) / 2;
            basePrice = close;
            data.push({ time, open, high, low, close });
        }

        candlestickSeries.setData(data);

        // วาดระดับราคาสำคัญ (Order Block / Liquidity Price Levels)
        const currentPrice = data[data.length - 1].close;
        
        // Supply Zone Line (Sell Target)
        candlestickSeries.createPriceLine({
            price: currentPrice + 18.5,
            color: '#f85149',
            lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Solid,
            axisLabelVisible: true,
            title: 'SUPPLY / SELL ZONE',
        });

        // Demand Zone Line (Buy Target)
        candlestickSeries.createPriceLine({
            price: currentPrice - 15.2,
            color: '#2ea043',
            lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Solid,
            axisLabelVisible: true,
            title: 'DEMAND / BUY ZONE',
        });

        // ปรับขนาด Chart อัตโนมัติเมื่อหมุนหน้าจอหรือรีไซส์
        window.addEventListener('resize', () => {
            chart.applyOptions({
                width: chartElement.clientWidth,
                height: chartElement.clientHeight
            });
        });
    </script>
</body>
</html>
