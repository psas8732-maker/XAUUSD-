<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XAUUSD Institutional Zones</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
        }

        header {
            background: #1e222d;
            padding: 0 16px;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            flex-shrink: 0;
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: #f0883e;
            letter-spacing: 0.5px;
        }

        .badge {
            background: #2962ff;
            color: #ffffff;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .chart-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 48px);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <header>
            <div class="title">XAUUSD INSTITUTIONAL ZONES</div>
            <span class="badge">LIVE CHART</span>
        </header>
        
        <div class="chart-container">
            <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_widget&symbol=OANDA%3AXAUUSD&interval=15&hidesidetoolbar=0&symboledit=1&saveimage=1&toolbarbg=1e222d&studies=STD%3APivots%251High%251Low&theme=dark&style=1&timezone=Asia%2FBangkok"></iframe>
        </div>
    </div>

</body>
</html>
