<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XAUUSD Institutional Zones</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: #e1e4e8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available; /* สำหรับ iOS Safari */
        }

        header {
            background: #161b22;
            padding: 0 16px;
            border-bottom: 1px solid #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            flex-shrink: 0;
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: #f0883e;
            letter-spacing: 0.5px;
        }

        .status {
            font-size: 10px;
            background: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            border: 1px solid #238636;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        #chart-container {
            flex: 1 1 auto;
            width: 100%;
            position: relative;
            background: #0b0e14;
        }

        .legend {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            font-size: 11px;
            background: rgba(22, 27, 34, 0.85);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            pointer-events: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-supply { background: #f85149; }
        .dot-demand { background: #2ea043; }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <div class="title">XAUUSD ORDER FLOW</div>
            <div class="status">LIVE ZONES</div>
        </header>
        
        <div id="chart-container">
            <div class="legend">
                <div class="legend-item"><span class="dot dot-supply"></span> Supply / Sell Zone</div>
                <div class="legend-item"><span class="dot dot-demand"></span> Demand / Buy Zone</div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('chart-container');
        
        const chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: container.clientHeight,
            layout: {
                backgroundColor: '#0b0e14',
                textColor: '#8b949e',
            },
            grid: {
                vertLines: { color: '#161b22' },
                horzLines: { color: '#161b22' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            rightPriceScale: {
                borderColor: '#30363d',
            },
            timeScale: {
                borderColor: '#30363d',
                timeVisible: true,
                secondsVisible: false,
            },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#2ea043',
            downColor: '#f85149',
            borderVisible: false,
            wickUpColor: '#2ea043',
            wickDownColor: '#f85149',
        });

        // จำลองข้อมูลราคา Gold
        const now = Math.floor(Date.now() / 1000);
        let basePrice = 2650.00;
        const data = [];

        for (let i = 60; i >= 0; i--) {
            const time = now - (i * 3600);
            const open = basePrice + (Math.random() - 0.48) * 8;
            const high = open + Math.random() * 6;
            const low = open - Math.random() * 6;
            const close = (high + low) / 2;
            basePrice = close;
            data.push({ time, open, high, low, close });
        }

        candlestickSeries.setData(data);

        const currentPrice = data[data.length - 1].close;
        
        // วาดเส้นแนวรับ-แนวต้านหลัก
        candlestickSeries.createPriceLine({
            price: currentPrice + 18.5,
            color: '#f85149',
            lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Solid,
            axisLabelVisible: true,
            title: 'SUPPLY / SELL ZONE',
        });

        candlestickSeries.createPriceLine({
            price: currentPrice - 15.2,
            color: '#2ea043',
            lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Solid,
            axisLabelVisible: true,
            title: 'DEMAND / BUY ZONE',
        });

        // ปรับขนาดความสูงอัตโนมัติให้เต็ม Container
        function fitChart() {
            if (container) {
                chart.applyOptions({
                    width: container.clientWidth,
                    height: container.clientHeight
                });
            }
        }

        window.addEventListener('resize', fitChart);
        setTimeout(fitChart, 100);
    </script>
</body>
</html>
